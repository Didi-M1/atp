[pytest]
# Add the project root to sys.path so 'atp' package is importable
pythonpath = .

# Default flags for every run
addopts = -v --tb=short

# Silence the "PytestUnknownMarkWarning" for all registered marks
markers =
    system:      CPU, RAM, storage, temperature tests
    peripherals: USB, SPI, Ethernet, I2C peripheral detection
    firmware:    BIOS / DMI / UEFI configuration checks
    stability:   Reboot sequence and poweroff tests
    network:     Connectivity, latency, packet-loss, and MTU tests
    serial:      Serial port open, configure, and loopback tests
